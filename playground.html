<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0c0c" />
    <title>Playground — AIGC Visual Designer</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="playground-page is-loading">
    <div class="preloader" aria-hidden="true">
      <div class="preloader__visual">
        <img src="./assets/work-02.svg" alt="" data-preload-image />
      </div>
      <div class="preloader__meta">
        <span>Just a sec!</span>
        <span data-preloader-count>000</span>
      </div>
    </div>

    <header class="playground-header">
      <a class="playground-header__back" href="./index.html">
        <span>←</span> Back to portfolio
      </a>
      <p>Visual studies / 2025—2026</p>
    </header>

    <main class="playground">
      <section class="playground__intro">
        <h1>Visual<br />Playground</h1>
        <p>
          持续进行的个人视觉研究：材料、光线、形态与生成式叙事。这里没有客户简报，只有对未知画面的好奇。
        </p>
      </section>

      <div class="playground-grid">
        <figure class="playground-item">
          <img src="./assets/work-01.svg" alt="荧光绿与钴蓝色抽象花体视觉" />
          <figcaption><span>Chromatic Bloom</span><span>01 / 2026</span></figcaption>
        </figure>
        <figure class="playground-item">
          <img src="./assets/work-02.svg" alt="深色空间中的金属流体雕塑" />
          <figcaption><span>Soft Machine</span><span>02 / 2026</span></figcaption>
        </figure>
        <figure class="playground-item">
          <img src="./assets/work-03.svg" alt="暖白与朱砂色概念视觉" />
          <figcaption><span>New Ritual</span><span>03 / 2025</span></figcaption>
        </figure>
        <figure class="playground-item">
          <img src="./assets/about-form.svg" alt="绿色光场中的抽象人形视觉" />
          <figcaption><span>Signal Body</span><span>04 / 2025</span></figcaption>
        </figure>
        <figure class="playground-item">
          <img src="./assets/work-04.svg" alt="锈红色雾气中的透明几何体" />
          <figcaption><span>After Memory</span><span>05 / 2025</span></figcaption>
        </figure>
      </div>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
